name: Build Android APK and App Bundle

on:
  push:
    branches: [main, master, feature/five-stage-missions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack Android project
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          if [ -z "$archive" ]; then
            echo "No project ZIP found in repository."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$archive" -d extracted
          project_dir="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"
          if [ -z "$project_dir" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts in the archive."
            find extracted -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Android project found at: $project_dir"

      - name: Apply mission progression fix
        run: python3 "$GITHUB_WORKSPACE/patches/mission_progression.py" "$PROJECT_DIR"

      - name: Upload extracted Android source for inspection
        uses: actions/upload-artifact@v4
        with:
          name: chronicles-of-words-source
          path: extracted/
          if-no-files-found: error
          retention-days: 3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug bundleDebug
          else
            gradle --no-daemon assembleDebug bundleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chronicles-of-words-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: chronicles-of-words-debug-aab
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 14
